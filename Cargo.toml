[workspace]
resolver = "3"
members = ["proto", "bridge", "tui"]

[workspace.package]
version = "0.4.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/roib/omabubble"
# The crate names are generic; nothing here is meant for crates.io.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"

[profile.release]
strip = true
